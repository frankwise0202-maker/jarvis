<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<title>Jarvis</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: #04070c; color: #e1f6ff;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 16px; box-sizing: border-box; text-align: center;
  }
  .ring { width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 50%;
    border: 1px solid rgba(78, 196, 255, 0.35); position: relative;
    box-shadow: 0 0 40px rgba(62, 224, 255, 0.18); }
  .ring::before, .ring::after { content: ""; position: absolute; border-radius: 50%; }
  .ring::before { inset: 14px; border: 2px dashed rgba(62, 224, 255, 0.55); animation: spin 9s linear infinite; }
  .ring::after { inset: 44px; background: radial-gradient(circle, #8af3ff 0%, #3ee0ff 45%, rgba(62,224,255,0) 75%);
    animation: pulse 2.4s ease-in-out infinite; }
  h1 { font-size: 13px; letter-spacing: 0.32em; font-weight: 600; margin: 0 0 10px; color: #3ee0ff; }
  p { margin: 0; color: #abc8d9; max-width: 28em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(0.82); opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) { .ring::before, .ring::after { animation: none; } }
</style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
    <h1>JARVIS</h1>
    <p>Systems coming online. The full app is being built and will appear here automatically.</p>
  </main>
</body>
</html>
